stages:
  - test

.node-test:
  stage: test
  before_script:
    - node --version
    - npm --version
    - npm install --ignore-scripts
  script:
    - npm run check
    - npm test
    - npm pack --dry-run

node-22:
  extends: .node-test
  image: node:22-bookworm-slim

node-24:
  extends: .node-test
  image: node:24-bookworm-slim

node-26:
  extends: .node-test
  image: node:26-bookworm-slim
